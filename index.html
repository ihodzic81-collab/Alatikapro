<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6C5CE7" />
  <meta name="description" content="Alatika Pro — lični organizator: podsetnici, računi, dokumenta, novac." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Alatika Pro</title>

  <style>
    header.app-header {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      width: 100% !important;
      padding-right: 0.75rem !important;
    }
    header.app-header > .brand {
      display: flex !important;
      align-items: center !important;
      gap: 0.5rem !important;
      flex: 0 1 auto !important;
      min-width: 0 !important;
    }
    header.app-header > .brand .brand-text {
      min-width: 0 !important;
    }
    header.app-header > .brand .brand-name {
      font-size: 1rem !important;
    }
    header.app-header > .brand .brand-tagline {
      display: none !important;
    }
    header.app-header > .header-actions {
      display: flex !important;
      align-items: center !important;
      gap: 0.1rem !important;
      flex: 0 0 auto !important;
      margin-left: auto !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
    header.app-header > .header-actions .icon-btn {
      width: 38px !important;
      height: 38px !important;
    }
  </style>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/web-app-manifest-192x192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/layout-v6.css" />
  <link rel="stylesheet" href="css/modules.css" />
  <link rel="stylesheet" href="css/pin.css" />
  <link rel="stylesheet" href="css/profile.css" />
  <link rel="stylesheet" href="css/reminders.css" />
  <link rel="stylesheet" href="css/bills.css" />
  <link rel="stylesheet" href="css/items.css" />
  <link rel="stylesheet" href="css/money.css" />
  <link rel="stylesheet" href="css/rates.css" />
</head>
<body>
  <div id="app">
    <header class="app-header" id="appHeader">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">A</div>
        <div class="brand-text">
          <span class="brand-name">ALATIKA<span class="brand-pro">PRO</span></span>
          <span class="brand-tagline" data-i18n="app.tagline">Sve važno, na jednom mestu.</span>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="langToggle" aria-label="Jezik / Language">
          <span id="langLabel">SR</span>
        </button>
        <button type="button" class="icon-btn" id="themeToggle" aria-label="Tema / Theme">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="settingsBtn" aria-label="Podešavanja / Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="profileBtn" aria-label="Profil">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
      </div>
    </header>

    <main class="app-main" id="appMain" role="main">
      <section class="view" id="view-home" data-view="home" hidden>
        <div class="home-greeting">
          <h1 class="home-hello" id="homeHello">Zdravo!</h1>
          <p class="home-date" id="homeDate"></p>
        </div>
        <div class="home-section">
          <h2 class="home-section-title" data-i18n="home.modules">Moduli</h2>
          <div class="home-cards" id="homeCards"></div>
        </div>
        <div class="home-section">
          <h2 class="home-section-title" data-i18n="home.widgetsTitle">Brzi pregled</h2>
          <div class="home-widgets" id="homeWidgets"></div>
        </div>
      </section>

      <section class="view" id="view-reminders" data-view="reminders" hidden></section>
      <section class="view" id="view-bills" data-view="bills" hidden></section>
      <section class="view" id="view-items" data-view="items" hidden></section>
      <section class="view" id="view-money" data-view="money" hidden></section>
    </main>

    <div class="footer-wrap">
      <div class="footer-title" data-i18n="home.quickActionsTitle">Brze akcije</div>
      <nav class="bottom-nav" id="bottomNav" role="navigation" aria-label="Glavna navigacija">
        <button type="button" class="nav-btn" data-route="home">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12l9-9 9 9v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"></path></svg>
          <span data-i18n="nav.home">Početna</span>
        </button>
        <button type="button" class="nav-btn nav-action" data-action="add-reminder">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span data-i18n="nav.addReminder">Podsetnik</span>
        </button>
        <button type="button" class="nav-btn nav-action" data-action="add-bill">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l5 5v15H6z"></path><path d="M14 2v6h6"></path><line x1="12" y1="12" x2="12" y2="18"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
          <span data-i18n="nav.addBill">Račun</span>
        </button>
        <button type="button" class="nav-btn nav-action" data-action="add-item">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="12" y1="12" x2="12" y2="16"></line><line x1="10" y1="14" x2="14" y2="14"></line></svg>
          <span data-i18n="nav.addItem">Dokument</span>
        </button>
        <button type="button" class="nav-btn nav-action" data-action="add-money">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
          <span data-i18n="nav.addMoney">Transakcija</span>
        </button>
      </nav>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/currencies.js"></script>
  <script src="js/nbs.js"></script>
  <script src="js/converter.js"></script>
  <script src="js/rates-widget.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pin.js"></script>
  <script src="js/pin-ui.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/help.js"></script>
  <script src="js/home.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/bills.js"></script>
  <script src="js/items.js"></script>
  <script src="js/money.js"></script>
  <script src="js/app.js"></script>

  <script>
    (function () {
      'use strict';

      function hasOpenModal() {
        return !!document.querySelector('.modal-overlay.show, .pin-overlay.show, .help-modal-overlay.show');
      }

      function closeOpenModal() {
        const modal = document.querySelector('.modal-overlay.show, .pin-overlay.show, .help-modal-overlay.show');
        if (!modal) return false;
        const closeBtn = modal.querySelector(
          '#detailClose, #rateDetailClose, #checkDetailClose, #itemDetailClose, ' +
          '#txDetailClose, #convClose, #helpCloseBtn, #remCancel, #billCancel, ' +
          '#rateCancel, #checkCancel, #itemCancel, #moneyCancel, #budgetCancel, ' +
          '#pinCancel, #receiptCancel, #receiptDetailClose, #settingsClose, ' +
          '#profileClose, #locationCancel, #editorCancel, #exitNo'
        );
        if (closeBtn) { try { closeBtn.click(); return true; } catch (e) {} }
        try { modal.click(); return true; } catch (e) {}
        return false;
      }

      function isOnHome() {
        const route = window.router && window.router.current ? window.router.current() : 'home';
        return route === 'home';
      }

      function onPopState() {
        if (hasOpenModal()) {
          closeOpenModal();
          return;
        }
        if (!isOnHome()) {
          if (window.router && window.router.navigate) {
            window.router.navigate('home');
          }
          return;
        }
      }

      let wasOpen = false;
      const observer = new MutationObserver(function () {
        const nowOpen = hasOpenModal();
        if (nowOpen && !wasOpen) {
          wasOpen = true;
          try { history.pushState({ app: 'alatikapro', guard: Date.now() }, ''); } catch (e) {}
        } else if (!nowOpen && wasOpen) {
          wasOpen = false;
        }
      });
      observer.observe(document.body, {
        childList: true, subtree: true, attributes: true, attributeFilter: ['class']
      });

      if (window.router && window.router.onRouteChange) {
        window.router.onRouteChange(function (route) {
          if (route !== 'home') {
            try { history.pushState({ app: 'alatikapro', guard: Date.now() }, ''); } catch (e) {}
          }
        });
      }

      try { history.replaceState({ app: 'alatikapro', screen: 'home' }, '', '#home'); } catch (e) {}

      window.addEventListener('popstate', onPopState);
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        if ('caches' in window) {
          caches.keys().then(function (names) {
            return Promise.all(names.map(function (name) { return caches.delete(name); }));
          });
        }
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          return Promise.all(registrations.map(function (reg) { return reg.unregister(); }));
        }).then(function () {
          return navigator.serviceWorker.register('sw-v6.js');
        }).then(function (reg) {
          console.log('SW registrovan:', reg.scope);
        }).catch(function (err) {
          console.warn('SW greška:', err);
        });
      });
    }
  </script>
</body>
</html>
